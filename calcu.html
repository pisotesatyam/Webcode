<html>
<body>

<script>
let a = 10, b = 5;
let op = "+";

switch(op) {
    case "+":
        document.write(a+b);
        break;

    case "-":
        document.write(a-b);
        break;

    case "*":
        document.write(a*b);
        break;

    case "/":
        document.write(a/b);
        break;

    default:
        document.write("Invalid");
}
</script>

</body>
</html>
